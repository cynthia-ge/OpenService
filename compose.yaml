services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openservice
      POSTGRES_USER: openservice
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Generate local credentials with the Java setup command first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U openservice"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      target: runtime
    ports: ["127.0.0.1:${PORT:-8090}:8080"]
    environment:
      DATABASE_URL: postgresql+psycopg://openservice:${DB_PASSWORD}@db/openservice
      SECRET_KEY: ${SECRET_KEY:?Generate local credentials with the Java setup command first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Generate local credentials with the Java setup command first}
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  database:
