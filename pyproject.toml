[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "openservice"
version = "0.1.0"
description = "An independently implemented service operations platform"
requires-python = ">=3.12"
dependencies = ["Flask==3.1.3", "SQLAlchemy==2.1.8", "psycopg[binary]==3.3.9", "gunicorn==27.0.1"]
[project.optional-dependencies]
test = ["pytest==9.2.0", "coverage==7.17.3", "playwright==1.65.1"]
[tool.setuptools.package-data]
openservice = ["templates/*.html", "static/*.css"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.coverage.run]
source = ["openservice", "scripts"]
branch = true
[tool.coverage.report]
show_missing = true
fail_under = 100
