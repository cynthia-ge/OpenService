<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main><section class="page-heading"><div><span class="eyebrow">ACCOUNTABILITY, BUILT IN</span><h1>A clear history of every change.</h1><p>The latest 200 record events, including updates, notes, imports and deletions.</p></div></section><section class="panel"><div class="table-scroll"><table><thead><tr><th>When (UTC)</th><th>Who</th><th>Action</th><th>Record</th><th>Details</th></tr></thead><tbody><tr th:each="event:${events}"><td class="nowrap" th:text="${event.created}"></td><td th:text="${event.actor}"></td><td><span class="status" th:text="${event.action}"></span></td><td><code th:text="${event.record_id}"></code></td><td><details><summary>View change</summary><pre th:text="${event.detailText}"></pre></details></td></tr><tr th:if="${events.isEmpty()}"><td colspan="5" class="empty">Your first change starts the story.</td></tr></tbody></table></div></section></main></html>
