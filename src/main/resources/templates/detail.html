<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main><a class="back-link" th:href="@{/workspace/{table}(table=${table})}" th:text="${'← '+definition.label}"></a><section class="page-heading"><div><span class="eyebrow" th:text="${data.getOrDefault('number','NEW RECORD')}"></span><h1 th:text="${data.getOrDefault('short_description','Let’s get it moving.')}"></h1><p th:text="${item!=null ? 'Keep the context, decisions and next steps together.' : 'A few details now. A clearer path forward.'}"></p></div><span th:if="${item!=null}" class="pill" th:text="${data.containsKey('state') ? definition.states.getOrDefault(data.state,data.state) : 'Registered'}"></span></section><div class="detail-grid"><section class="panel"><div class="panel-heading"><h2>Record details</h2><span class="muted" th:text="${item!=null ? 'Revision '+data.sys_mod_count : 'Ready when you are'}"></span></div><form method="post" class="record-form"><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="revision" th:value="${data.getOrDefault('sys_mod_count','')}"><div class="field-grid"><label th:each="field:${definition.fields}" th:class="${#lists.contains({'short_description','description','text','implementation_plan'},field.key) ? 'wide' : ''}"><th:block th:text="${field.value}"></th:block><select th:if="${field.key=='state'}" name="state" th:disabled="${user.role=='reader'}"><option th:each="choice:${stateChoices}" th:value="${choice.key}" th:selected="${choice.key==currentState}" th:text="${choice.value}"></option></select><select th:if="${field.key=='priority'}" name="priority" th:disabled="${user.role=='reader'}"><option th:each="choice:${priorities}" th:value="${choice.key}" th:selected="${data.getOrDefault('priority','3')==choice.key}" th:text="${choice.key+' · '+choice.value}"></option></select><textarea th:if="${#lists.contains({'description','text','implementation_plan'},field.key)}" th:name="${field.key}" rows="5" th:readonly="${user.role=='reader'}" th:text="${data.getOrDefault(field.key,'')}"></textarea><input th:unless="${#lists.contains({'state','priority','description','text','implementation_plan'},field.key)}" th:name="${field.key}" th:value="${data.getOrDefault(field.key,'')}" th:required="${field.key=='short_description'}" th:readonly="${user.role=='reader'}"></label></div><div th:if="${user.role!='reader'}" class="form-footer"><span class="muted">Changes are recorded in the audit trail.</span><button class="button primary" th:text="${item!=null ? 'Save changes →' : 'Create record →'}"></button></div></form></section><aside class="right-column"><section th:if="${item!=null and table=='sys_user_group' and user.role=='admin'}" class="panel"><div class="panel-heading"><h2>Group members</h2></div><p>Membership does not grant account roles. Inactive accounts retain membership but cannot sign in.</p><ul><li th:each="member:${members}"><span th:text="${member.name}"></span><small th:if="${member.active==0}"> Inactive</small><form method="post" th:action="@{/group-members/{id}(id=${item.sys_id})}"><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="operation" value="remove"><input type="hidden" name="user_id" th:value="${member.user_id}"><button class="button compact" th:aria-label="${'Remove '+member.name}">Remove member</button></form></li></ul><form method="post" class="record-form" th:action="@{/group-members/{id}(id=${item.sys_id})}"><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="operation" value="add"><label>Member username<input name="username" required maxlength="80"></label><button class="button">Add member</button></form></section><section th:if="${item!=null and user.role=='admin'}" class="panel"><div class="panel-heading"><h2>Record visibility</h2></div><form method="post" th:action="@{/record-access/{table}/{id}(table=${table},id=${item.sys_id})}" class="record-form"><input type="hidden" name="csrf" th:value="${csrf}"><label for="record-visibility">Visibility</label><select id="record-visibility" name="visibility"><option value="workspace" th:selected="${access.visibility=='workspace'}">Workspace</option><option value="private" th:selected="${access.visibility=='private'}">Private account and administrators</option><option value="group" th:selected="${access.visibility=='group'}">Group members and administrators</option></select><label>Allowed username<input name="owner" th:value="${access.owner}" maxlength="80"></label><label for="access-group">Allowed group</label><select id="access-group" name="group_id"><option value="">Choose a group</option><option th:each="group:${accessGroups}" th:value="${group.sys_id}" th:selected="${access.group_id==group.sys_id}" th:text="${group.data.getOrDefault('short_description','Unnamed group')}"></option></select><button class="button">Save visibility</button></form></section><section class="panel"><div class="panel-heading"><h2>Activity</h2><span class="live-dot"></span></div><th:block th:if="${item!=null}"><form th:if="${user.role!='reader'}" class="note-form" method="post" th:action="@{/record/{table}/{id}/note(table=${table},id=${item.sys_id})}"><input type="hidden" name="csrf" th:value="${csrf}"><label>Add an internal note<textarea name="body" rows="3" placeholder="Leave a useful update…" required></textarea></label><button class="button compact">Add note</button></form><div class="timeline"><article th:each="event:${events}"><span class="timeline-dot"></span><strong th:text="${event.actor}"></strong><small th:text="${event.created+' UTC'}"></small><p th:text="${event.action=='note' ? event.detail.body : #strings.capitalize(event.action)}"></p></article></div></th:block><div th:if="${item==null}" class="empty"><p>Your record’s story will appear here.</p></div></section><section th:if="${item!=null}" class="panel"><div class="panel-heading"><h2>Attachments</h2><span class="count" th:text="${attachments.size()}"></span></div><div class="attachment-list"><a th:each="file:${attachments}" th:href="@{/attachment/{id}(id=${file.sys_id})}" th:text="${'↓ '+file.name}"></a><form th:if="${user.role!='reader'}" method="post" enctype="multipart/form-data" th:action="@{/record/{table}/{id}/attachment(table=${table},id=${item.sys_id})}"><input type="hidden" name="csrf" th:value="${csrf}"><label>Supporting files <small>Up to 5 MB each</small><input type="file" name="file" required></label><button class="button compact">Upload</button></form></div></section></aside></div></main></html>
