<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Join OpenService</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="error-page"><span class="eyebrow">YOUR INVITATION</span><h1>Join your workspace</h1><p>Username: <strong th:text="${invitation.name}"></strong></p><p>Role: <strong th:text="${invitation.role}"></strong>. All local roles can read workspace-visible records. Private records require explicit access.</p><p th:text="${'This link expires at '+invitation.expires_at}"></p><div th:if="${error!=null}" class="notice" role="alert" th:text="${error}"></div><form method="post" class="record-form"><input type="hidden" name="csrf" th:value="${csrf}"><label for="join-password">Choose your password</label><input id="join-password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="1024"><p>Use 12–1024 characters. After accepting, sign in with your new username and password.</p><button class="button primary">Accept invitation</button></form></main></body></html>
