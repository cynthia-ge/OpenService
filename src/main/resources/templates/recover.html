<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recover your OpenService account</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="error-page"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Choose a new password</h1><p>Account: <strong th:text="${recovery.name}"></strong></p><p th:text="${'This link expires at '+recovery.expires_at}"></p><div th:if="${error!=null}" class="notice" role="alert" th:text="${error}"></div><form method="post" class="record-form"><input type="hidden" name="csrf" th:value="${csrf}"><label for="recovery-password">New password</label><input id="recovery-password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="1024"><p>Use 12–1024 characters and a different password. This signs out every browser. You can then sign in with your new password.</p><button class="button primary">Reset password</button></form></main></body></html>
