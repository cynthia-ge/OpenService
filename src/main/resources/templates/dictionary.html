<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main><section class="page-heading"><div><span class="eyebrow">A SHARED FOUNDATION</span><h1>The structure behind your work.</h1><p>Configurable record types. Shared validation, workflows and history.</p></div><a class="button" href="/api/openservice/schema">View schema API ↗</a></section><div class="dictionary-grid"><section th:each="t:${tables}" class="panel"><div class="panel-heading"><h2 th:text="${t.definition.label}"></h2><code th:text="${t.name}"></code></div><div class="dictionary-fields"><div th:each="field:${t.definition.fields}"><span th:text="${field.value}"></span><code th:text="${field.key}"></code></div><th:block th:if="${!t.definition.states.isEmpty()}"><h3>Workflow</h3><p th:text="${#strings.listJoin(t.definition.states.values(), ' → ')}"></p></th:block><p th:if="${t.definition.states.isEmpty()}">No state workflow configured.</p></div></section></div></main></html>
