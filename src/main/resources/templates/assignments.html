<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main>
<a class="back-link" th:href="@{/admin/accounts/{id}(id=${account.user_id})}">← Account</a>
<section class="page-heading"><div><span class="eyebrow">WORK CONTINUITY</span><h1 th:text="${'Assigned work for '+account.name}"></h1><p th:text="${total+' configured assignments. Private access ownership is managed separately.'}"></p></div></section>
<section th:if="${preview!=null}" class="notice success"><p th:text="${'Preview passed. No assignments changed. Selected records: '+preview.transferred_count}"></p></section><section class="panel"><form method="post" th:action="@{/admin/accounts/{id}/assignments/transfer(id=${account.user_id})}"><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="page" th:value="${page}"><div class="table-scroll"><table><thead><tr><th>Select</th><th>Table</th><th>Record</th><th>Summary</th></tr></thead><tbody>
<tr th:each="record:${records}"><td><input type="hidden" th:name="${'revision_'+record.sys_id}" th:value="${preview!=null and #maps.containsKey(preview.expected_revisions,record.sys_id) ? preview.expected_revisions[record.sys_id] : record.revision}"><input type="checkbox" name="record_ids" th:value="${record.sys_id}" th:checked="${preview!=null and #lists.contains(preview.record_ids,record.sys_id)}" th:aria-label="${'Select '+record.number}"></td><td th:text="${record.table}"></td><td><a th:href="@{/record/{table}/{id}(table=${record.table},id=${record.sys_id})}" th:text="${record.number}"></a></td><td th:text="${record.summary}"></td></tr>
<tr th:if="${records.isEmpty()}"><td colspan="4">No configured assignments.</td></tr></tbody></table></div>
<div class="record-form"><label>Replacement username<input name="new_owner" th:value="${newOwner}" required maxlength="80"></label><p>All selected records must accept the replacement in their assignment group. Records changed since this page was loaded require a fresh review. Private access is managed separately.</p><button class="button" name="operation" value="preview">Preview handover</button><button class="button primary" name="operation" value="transfer">Transfer selected assignments</button></div></form><div class="form-footer"><a th:if="${page>1}" th:href="@{/admin/accounts/{id}/assignments(id=${account.user_id},page=${page-1})}">Previous assignments</a><span th:text="${'Page '+page+' of '+pages}"></span><a th:if="${page<pages}" th:href="@{/admin/accounts/{id}/assignments(id=${account.user_id},page=${page+1})}">Next assignments</a></div></section>
</main></html>
